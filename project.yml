name: Cliiippo
options:
  bundleIdPrefix: io.github.felixlyfe
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Stable self-signed identity so macOS keeps the Accessibility grant across rebuilds.
    # Create it once — see docs/signing.md.
    CODE_SIGN_IDENTITY: "Cliiippo Self-Signed"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Release:
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Cliiippo:
    type: application
    platform: macOS
    sources:
      - path: Cliiippo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.felixlyfe.cliiippo
        INFOPLIST_FILE: Cliiippo/Info.plist
        CODE_SIGN_ENTITLEMENTS: Cliiippo/Cliiippo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Debug is its own channel, like beta/stable in release.yml: a distinct bundle id means a
        # locally-run build gets its own prefs, caches, TCC grants and login item instead of
        # inheriting — and corrupting — the installed app's state.
        Debug:
          PRODUCT_NAME: Cliiippo Dev
          PRODUCT_BUNDLE_IDENTIFIER: io.github.felixlyfe.cliiippo.dev
